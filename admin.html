<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị nạp tiền</title><style>body{background:#0b0914;color:#f8f5ff;font:16px system-ui;margin:20px}main{max-width:950px;margin:auto}button{padding:9px 13px;border:0;border-radius:8px;background:#a855f7;color:white;font-weight:bold}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:10px;border-bottom:1px solid #51406a;font-size:14px}.muted{color:#aaa}</style></head><body><main><h1>Quản trị – yêu cầu nạp tiền</h1><p class="muted">Trình duyệt sẽ hỏi tài khoản/mật khẩu quản trị (ADMIN_USERNAME / ADMIN_PASSWORD).</p><button onclick="load()">Tải lại danh sách</button><div id="msg"></div><table><thead><tr><th>ID</th><th>Khách</th><th>Số tiền</th><th>Nội dung CK</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></main><script>let headers={};async function load(){const r=await fetch('/api/admin/topups');if(r.status===401){msg.textContent='Nhập thông tin quản trị trong hộp thoại xác thực của trình duyệt.';return}const d=await r.json();rows.innerHTML=d.map(x=>`<tr><td>${x.id}</td><td>${x.username}</td><td>${x.amount.toLocaleString('vi-VN')}đ</td><td>${x.memo}</td><td>${x.status}</td><td>${x.status==='PENDING'?`<button onclick="act(${x.id},'approve')">Duyệt</button> <button onclick="act(${x.id},'reject')">Từ chối</button>`:'—'}</td></tr>`).join('');msg.textContent=''}async function act(id,a){if(!confirm('Bạn đã kiểm tra giao dịch MB Bank và muốn '+(a==='approve'?'cộng tiền vào ví?':'từ chối yêu cầu?')))return;const r=await fetch(`/api/admin/topups/${id}/${a}`,{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error);load()}load();</script></body></html>
